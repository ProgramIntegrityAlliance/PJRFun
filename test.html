<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - It Works!</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #667eea;
      margin: 0 0 20px 0;
      font-size: 2.5rem;
    }
    p {
      color: #555;
      font-size: 1.1rem;
      margin: 15px 0;
      line-height: 1.6;
    }
    .success {
      color: #22c55e;
      font-size: 4rem;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 999px;
      margin-top: 20px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    .file-info {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="success">✓</div>
    <h1>Success!</h1>
    <p>HTML files are working correctly in your environment.</p>

    <div class="file-info">
      <strong>Your fraud assessment tool is ready!</strong><br>
      Access it at:<br>
      <code>fraud-assessment-tool.html</code>
    </div>

    <a href="fraud-assessment-tool.html" class="btn">
      Open Assessment Tool →
    </a>

    <p style="margin-top: 30px; font-size: 0.9rem; color: #888;">
      If you see this page, everything is working!
    </p>
  </div>
</body>
</html>
